<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>고양시 애견동반카페 지도 · yupdduck</title>

  <style>
    :root {
      --bg: #fffaf3;
      --card: #ffffff;
      --text: #3b2f2a;
      --sub: #8a7a70;
      --line: #eadfd3;
      --accent: #f08a3c;      /* 애견동반 */
      --accent-soft: #fde8d4;
      --normal: #7a5c48;      /* 일반 카페 */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    header { padding: 16px 20px 0; }
    header h1 { font-size: 20px; letter-spacing: -0.02em; }
    header p { font-size: 13px; color: var(--sub); margin-top: 4px; }

    .tabs { display: flex; gap: 8px; padding: 14px 20px 12px; }
    .tab {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--sub);
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .tab .count { opacity: .85; margin-left: 4px; font-size: 12px; }

    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 12px;
      padding: 0 20px 20px;
    }
    aside { display: flex; flex-direction: column; min-height: 0; gap: 8px; }
    .filters { display: flex; gap: 6px; }
    .filters input, .filters select {
      font-family: inherit; font-size: 13px; color: var(--text);
      border: 1px solid var(--line); background: var(--card);
      border-radius: 10px; padding: 8px 10px; min-width: 0;
    }
    .filters input { flex: 1; }
    #status {
      font-size: 12px; color: var(--sub); line-height: 1.5;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    #refresh {
      border: 1px solid var(--line); background: var(--card); color: var(--sub);
      border-radius: 8px; padding: 4px 8px; font-size: 11px; cursor: pointer; font-family: inherit;
      white-space: nowrap;
    }
    #list {
      flex: 1; min-height: 0;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 8px;
      padding-right: 4px;
    }
    .item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
    }
    .item:hover, .item.focus { border-color: var(--accent); }
    .item .name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 11px; font-weight: 600;
      background: var(--accent-soft); color: var(--accent);
      padding: 2px 7px; border-radius: 999px;
    }
    .item .addr { font-size: 12px; color: var(--sub); margin-top: 4px; }
    .item .cat { font-size: 11px; color: var(--sub); margin-top: 3px; opacity: .8; }
    .empty { color: var(--sub); font-size: 13px; padding: 20px 4px; line-height: 1.6; }
    .error { color: #c0392b; font-size: 13px; padding: 12px 4px; line-height: 1.6; word-break: break-all; }

    /* 오른쪽: 위는 지도, 카페를 누르면 아래에 로드뷰가 열려요 */
    section.view { display: flex; flex-direction: column; min-height: 0; gap: 8px; }
    #mapWrap { position: relative; flex: 1; min-height: 200px; }
    #map { position: absolute; inset: 0; border-radius: 16px; border: 1px solid var(--line); }
    .legend {
      position: absolute; left: 12px; bottom: 12px; z-index: 5;
      background: rgba(255,255,255,.95); border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 12px; font-size: 12px;
      display: flex; gap: 12px;
    }

    #rvPanel { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 8px; }
    #viewBar {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 10px 14px; display: flex; align-items: center; gap: 10px;
    }
    #viewInfo { flex: 1; min-width: 0; }
    #viewInfo .t { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #viewInfo .s { font-size: 12px; color: var(--sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #viewInfo a { color: var(--accent); }
    #rvClose {
      border: 1px solid var(--line); background: var(--card); color: var(--text);
      border-radius: 10px; padding: 8px 12px; font-size: 13px; cursor: pointer; font-family: inherit;
      white-space: nowrap;
    }
    #rvWrap { position: relative; flex: 1; min-height: 160px; }
    #roadview { position: absolute; inset: 0; border-radius: 16px; border: 1px solid var(--line); overflow: hidden; background: #e9e2d8; }
    #rvMsg {
      position: absolute; inset: 0; z-index: 5; border-radius: 16px; display: none;
      align-items: center; justify-content: center; text-align: center;
      background: rgba(255,250,243,.96); color: var(--sub); font-size: 14px; line-height: 1.7; padding: 24px;
    }

    /* 로드뷰 위에 뜨는 카페 이름표 */
    .rv-label {
      background: #fff; border: 2px solid var(--normal); color: var(--text);
      border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700;
      box-shadow: 0 2px 8px rgba(0,0,0,.3); white-space: nowrap;
    }
    .rv-label.pet { border-color: var(--accent); }

    .iw { padding: 8px 12px; font-size: 13px; line-height: 1.5; white-space: nowrap; }

    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; grid-template-rows: 75vh auto; }
      section.view { order: -1; }
      aside { max-height: 40vh; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🐾 고양시 카페 지도</h1>
    <p>지도에서 카페를 누르면 그 앞 거리를 로드뷰로 볼 수 있어요</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="all">전체 카페 <span class="count" id="cnt-all"></span></button>
    <button class="tab" data-tab="pet">애견동반카페 <span class="count" id="cnt-pet"></span></button>
  </div>

  <main>
    <aside>
      <div class="filters">
        <input id="q" type="search" placeholder="카페 이름·주소 검색" />
        <select id="gu">
          <option value="">고양시 전체</option>
          <option value="덕양구">덕양구</option>
          <option value="일산동구">일산동구</option>
          <option value="일산서구">일산서구</option>
        </select>
      </div>
      <div id="status"><span>준비 중...</span></div>
      <div id="list"><p class="empty">카페 정보를 불러오는 중이에요...</p></div>
    </aside>

    <section class="view">
      <div id="mapWrap">
        <div id="map"></div>
        <div class="legend">
          <span>🐾 애견동반</span>
          <span>☕ 일반</span>
        </div>
      </div>

      <div id="rvPanel">
        <div id="viewBar">
          <div id="viewInfo"></div>
          <button id="rvClose">✕ 로드뷰 닫기</button>
        </div>
        <div id="rvWrap">
          <div id="roadview"></div>
          <div id="rvMsg"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- 어떤 오류가 나도 왼쪽 목록 칸에 원인을 보여주는 장치 -->
  <script>
    function showError(msg) {
      const el = document.getElementById("list");
      if (el) el.innerHTML = '<p class="error">⚠️ 오류: ' + String(msg).replace(/</g, "&lt;") + "</p>";
    }
    window.addEventListener("error", e => showError(e.message));
    window.addEventListener("unhandledrejection", e => showError(e.reason && e.reason.message ? e.reason.message : e.reason));
  </script>

  <!-- 카카오 SDK (장소검색 services + 마커 묶음 clusterer, 로드뷰는 기본 포함) -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=09ecc13bc06db3f0c313c32b6506454a&libraries=services,clusterer&autoload=false"></script>

  <script>
    // ============================================================
    //  설정
    // ============================================================
    const GOYANG_CENTER = { lat: 37.6584, lng: 126.8320 };                  // 고양시청 부근
    const GOYANG_RECT   = { x1: 126.66, y1: 37.57, x2: 126.97, y2: 37.77 }; // 고양시 전체를 덮는 사각형(경도·위도)

    // 애견동반 후보를 찾는 검색어
    const PET_KEYWORDS = ["애견동반", "애견카페", "펫카페", "반려견 동반", "강아지 카페", "도그카페", "펫프렌들리"];
    // 이름에 이 단어가 들어간 카페도 애견동반으로 분류
    const PET_NAME_REGEX = /애견|펫|도그|dog|강아지|반려견|퍼피|puppy/i;

    // ✋ 직접 보정하기 (카페 이름을 정확히 적어주세요)
    const MANUAL_ADD_PET    = [];  // 예: ["카페이름A", "카페이름B"]  → 애견동반으로 강제 표시
    const MANUAL_REMOVE_PET = [];  // 예: ["카페이름C"]              → 애견동반에서 제외

    const ROADVIEW_RADIUS = 80;              // 카페 주변 몇 m 안에서 로드뷰를 찾을지
    const CACHE_KEY = "yupdduck-cafes-v1";
    const CACHE_TTL = 1000 * 60 * 60 * 12;   // 12시간 동안은 저장된 결과를 재사용
    const MAX_CONCURRENT = 8;                // 동시에 보내는 검색 요청 수
    const MAX_DEPTH = 9;                     // 구역을 쪼개는 최대 횟수
    const LIST_LIMIT = 80;                   // 목록에 한 번에 그리는 최대 개수
  </script>

  <script>
    let map, places, infoWindow, clusterAll, clusterPet;
    let rv = null, rvClient = null;          // 로드뷰는 처음 열 때 만들어요
    let ITEMS = [];            // 불러온 카페 전체
    let FILTERED = [];         // 탭/검색/구 필터를 거친 카페 (지도 마커로 표시)
    let currentTab = "all";
    let focusedId = null;
    let lastPick = 0;          // 카페를 고른 시각 (목록이 갑자기 다시 그려지는 것 방지)
    let rvMarker = null, rvLabel = null, pendingFace = null;
    let imgPet, imgNormal;
    const stats = { failed: 0 };

    const $ = id => document.getElementById(id);
    const esc = (s = "") =>
      String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    if (typeof kakao === "undefined") {
      $("map").innerHTML =
        '<p style="padding:24px;line-height:1.6">지도를 불러오지 못했어요.<br>' +
        '① JavaScript 키가 맞는지<br>② 카카오 디벨로퍼스에 현재 주소(도메인)가 등록됐는지<br>' +
        '③ 카카오맵 사용 설정이 ON인지 확인해 주세요.</p>';
      showError("카카오 SDK를 불러오지 못했어요.");
    } else {
      kakao.maps.load(init);
    }

    // ------------------------------------------------------------
    //  초기화
    // ------------------------------------------------------------
    function init() {
      // 탭·검색·버튼부터 연결
      document.querySelectorAll(".tab").forEach(btn =>
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentTab = btn.dataset.tab;
          refreshAll();
        })
      );
      let timer;
      $("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(refreshAll, 250); });
      $("gu").addEventListener("change", refreshAll);
      $("rvClose").addEventListener("click", closeRoadview);

      map = new kakao.maps.Map($("map"), {
        center: new kakao.maps.LatLng(GOYANG_CENTER.lat, GOYANG_CENTER.lng),
        level: 8
      });
      map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);

      if (!kakao.maps.services || !kakao.maps.MarkerClusterer) {
        showError("services / clusterer 라이브러리가 로드되지 않았어요. SDK 주소에 &libraries=services,clusterer 가 있는지 확인해 주세요.");
        return;
      }

      places = new kakao.maps.services.Places();
      infoWindow = new kakao.maps.InfoWindow({ removable: true });
      imgPet = makeMarkerImage("#f08a3c", "🐾");
      imgNormal = makeMarkerImage("#7a5c48", "☕");
      clusterAll = makeClusterer("rgba(122,92,72,.88)");
      clusterPet = makeClusterer("rgba(240,138,60,.9)");

      kakao.maps.event.addListener(map, "idle", () => updateList(false));
      loadAll(false);
    }

    function makeMarkerImage(color, glyph) {
      const svg =
        '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40">' +
        '<path d="M16 39C16 39 2 24 2 14a14 14 0 0 1 28 0c0 10-14 25-14 25z" fill="' + color + '" stroke="#fff" stroke-width="2"/>' +
        '<text x="16" y="19" font-size="13" text-anchor="middle">' + glyph + "</text></svg>";
      return new kakao.maps.MarkerImage(
        "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg),
        new kakao.maps.Size(32, 40),
        { offset: new kakao.maps.Point(16, 40) }
      );
    }

    function makeClusterer(bg) {
      return new kakao.maps.MarkerClusterer({
        map: map,
        averageCenter: true,
        minLevel: 5,
        styles: [{
          width: "44px", height: "44px", background: bg, borderRadius: "22px",
          color: "#fff", textAlign: "center", fontWeight: "bold", lineHeight: "44px"
        }]
      });
    }

    // ------------------------------------------------------------
    //  데이터 불러오기 (캐시 → 없으면 카카오 장소검색)
    // ------------------------------------------------------------
    async function loadAll(force) {
      if (!force) {
        const cached = readCache();
        if (cached) { ITEMS = prepare(cached); refreshAll(); return; }
      }

      $("list").innerHTML = '<p class="empty">고양시 카페를 찾고 있어요. 처음에는 20~40초 정도 걸릴 수 있어요...</p>';
      const found = new Map();      // id → 장소
      const petIds = new Set();     // 애견동반 키워드로 잡힌 id
      stats.failed = 0;

      const tick = setInterval(() => { $("status").innerHTML = "<span>검색 중... 지금까지 " + found.size + "곳 발견</span>"; }, 500);

      try {
        // ① 고양시 전체 카페 (카테고리 CE7)
        const allTask = collect("cat", "CE7", GOYANG_RECT, 0, found, null);
        // ② 애견동반 후보 (키워드 검색, 카페만 걸러서)
        const petTask = Promise.all(PET_KEYWORDS.map(kw => collect("kw", kw, GOYANG_RECT, 0, found, petIds)));
        await Promise.all([allTask, petTask]);
      } finally {
        clearInterval(tick);
      }

      const raw = [...found.values()].map(p => {
        let pet = petIds.has(p.id) || PET_NAME_REGEX.test(p.place_name);
        if (MANUAL_ADD_PET.includes(p.place_name)) pet = true;
        if (MANUAL_REMOVE_PET.includes(p.place_name)) pet = false;
        return {
          id: p.id, n: p.place_name, a: p.road_address_name || p.address_name,
          t: p.phone, x: +p.x, y: +p.y, u: p.place_url, c: p.category_name, p: pet
        };
      });

      if (raw.length > 0 && stats.failed === 0) writeCache(raw);
      ITEMS = prepare(raw);
      refreshAll();
    }

    // 좌표·마커·구 정보를 붙이고 이름순으로 정렬
    function prepare(raw) {
      const items = raw.map(r => {
        const m = (r.a || "").match(/(덕양구|일산동구|일산서구)/);
        const it = { ...r, gu: m ? m[1] : "", pos: new kakao.maps.LatLng(r.y, r.x) };
        it.marker = new kakao.maps.Marker({ position: it.pos, image: it.p ? imgPet : imgNormal, title: it.n });
        kakao.maps.event.addListener(it.marker, "click", () => select(it, "map"));
        return it;
      });
      items.sort((a, b) => a.n.localeCompare(b.n, "ko"));
      $("cnt-all").textContent = items.length;
      $("cnt-pet").textContent = items.filter(i => i.p).length;
      return items;
    }

    // 요청 수를 제한하는 대기열 (한꺼번에 너무 많이 보내면 오류가 나기 때문)
    let active = 0;
    const queue = [];
    function limited(fn) {
      return new Promise((resolve, reject) => { queue.push({ fn, resolve, reject }); pump(); });
    }
    function pump() {
      while (active < MAX_CONCURRENT && queue.length) {
        const job = queue.shift();
        active++;
        job.fn().then(job.resolve, job.reject).finally(() => { active--; pump(); });
      }
    }

    function rawSearch(kind, arg, opts) {
      return new Promise(resolve => {
        const S = kakao.maps.services.Status;
        const cb = (data, status, pagination) => {
          if (status === S.OK) resolve({ ok: true, data, total: pagination.totalCount });
          else if (status === S.ZERO_RESULT) resolve({ ok: true, data: [], total: 0 });
          else resolve({ ok: false, data: [], total: 0 });
        };
        if (kind === "cat") places.categorySearch(arg, cb, opts);
        else places.keywordSearch(arg, cb, opts);
      });
    }

    async function callPlaces(kind, arg, opts) {
      for (let i = 0; i < 3; i++) {
        const r = await limited(() => rawSearch(kind, arg, opts));
        if (r.ok) return r;
        await sleep(500 * (i + 1));
      }
      stats.failed++;
      return { ok: false, data: [], total: 0 };
    }

    const rectStr = r => r.x1 + "," + r.y1 + "," + r.x2 + "," + r.y2;
    function splitRect(r) {
      const mx = (r.x1 + r.x2) / 2, my = (r.y1 + r.y2) / 2;
      return [
        { x1: r.x1, y1: r.y1, x2: mx, y2: my },
        { x1: mx, y1: r.y1, x2: r.x2, y2: my },
        { x1: r.x1, y1: my, x2: mx, y2: r.y2 },
        { x1: mx, y1: my, x2: r.x2, y2: r.y2 }
      ];
    }

    // 카카오 검색은 한 번에 최대 45개까지만 주기 때문에,
    // 결과가 45개를 넘는 구역은 4등분해서 다시 검색해요. (모든 카페를 빠짐없이 모으려는 방법)
    async function collect(kind, arg, rect, depth, found, petIds) {
      const base = { rect: rectStr(rect), size: 15 };
      const first = await callPlaces(kind, arg, { ...base, page: 1 });
      if (!first.ok || first.total === 0) return;

      if (first.total > 45 && depth < MAX_DEPTH) {
        await Promise.all(splitRect(rect).map(r => collect(kind, arg, r, depth + 1, found, petIds)));
        return;
      }

      const pages = Math.min(3, Math.ceil(first.total / 15));
      const rest = [];
      for (let p = 2; p <= pages; p++) rest.push(callPlaces(kind, arg, { ...base, page: p }));
      const results = [first.data, ...(await Promise.all(rest)).map(r => r.data)];

      results.flat().forEach(p => {
        if (!(p.address_name || "").includes("고양시")) return;          // 이웃 도시 제외
        if (kind === "kw") {
          // 키워드 검색은 식당·가게도 섞여 나오므로 카페만 남김
          const isCafe = (p.category_name || "").includes("카페") || /카페|커피|cafe|coffee/i.test(p.place_name);
          if (!isCafe) return;
          petIds.add(p.id);
        }
        found.set(p.id, p);
      });
    }

    function readCache() {
      try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (Date.now() - obj.t > CACHE_TTL || !Array.isArray(obj.items) || obj.items.length === 0) return null;
        return obj.items;
      } catch (e) { return null; }
    }
    function writeCache(items) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), items })); } catch (e) { /* 저장 실패는 무시 */ }
    }

    // ------------------------------------------------------------
    //  필터 → 지도 마커 / 목록
    // ------------------------------------------------------------
    function hasFilter() { return $("q").value.trim() !== "" || $("gu").value !== ""; }

    function refreshAll() {
      if (!ITEMS.length) return;
      const q = $("q").value.trim().toLowerCase();
      const gu = $("gu").value;

      FILTERED = ITEMS.filter(i =>
        (currentTab === "all" || i.p) &&
        (!gu || i.gu === gu) &&
        (!q || i.n.toLowerCase().includes(q) || (i.a || "").toLowerCase().includes(q))
      );

      infoWindow.close();
      clusterAll.clear();
      clusterPet.clear();
      (currentTab === "pet" ? clusterPet : clusterAll).addMarkers(FILTERED.map(i => i.marker));

      // 검색·구 선택을 했다면 결과가 한눈에 보이도록 지도를 맞춰줌
      if (hasFilter() && FILTERED.length > 0 && FILTERED.length < ITEMS.length) {
        const b = new kakao.maps.LatLngBounds();
        FILTERED.forEach(i => b.extend(i.pos));
        map.setBounds(b, 60, 60, 60, 60);
      }
      updateList(true);
    }

    function updateList(force) {
      if (!ITEMS.length) return;
      // 카페를 막 눌렀을 때는 지도가 움직여도 목록을 다시 그리지 않음 (스크롤이 튀는 것 방지)
      if (!force && Date.now() - lastPick < 1500) return;

      // 검색/구 선택을 안 했으면 "지금 화면 안의 카페"만, 했으면 결과 전체를 보여줌
      let shown = FILTERED;
      if (!hasFilter()) {
        const bounds = map.getBounds();
        shown = FILTERED.filter(i => bounds.contain(i.pos));
      }

      $("status").innerHTML =
        "<span>" + (currentTab === "pet" ? "애견동반카페 " : "고양시 카페 ") + FILTERED.length + "곳" +
        (hasFilter() ? "" : " · 화면 안 " + shown.length + "곳") +
        (stats.failed ? " (일부 구간 조회 실패)" : "") + "</span>" +
        '<button id="refresh" title="카카오에서 다시 불러오기">새로고침</button>';
      $("refresh").onclick = () => { try { localStorage.removeItem(CACHE_KEY); } catch (e) {} loadAll(true); };

      const listEl = $("list");
      listEl.innerHTML = "";
      if (shown.length === 0) {
        listEl.innerHTML = '<p class="empty">' + (hasFilter()
          ? "조건에 맞는 카페가 없어요. 검색어나 구 선택을 바꿔보세요."
          : "지금 화면에는 카페가 없어요. 지도를 움직이거나 줄여보세요.") + "</p>";
        return;
      }

      shown.slice(0, LIST_LIMIT).forEach(it => {
        const card = document.createElement("div");
        card.className = "item" + (it.id === focusedId ? " focus" : "");
        card.dataset.id = it.id;
        const cat = (it.c || "").split(">").pop().trim();
        card.innerHTML =
          '<div class="name">' + esc(it.n) + (it.p ? ' <span class="badge">애견동반</span>' : "") + "</div>" +
          '<div class="addr">' + esc(it.a) + "</div>" +
          (cat ? '<div class="cat">' + esc(cat) + "</div>" : "");
        card.addEventListener("click", () => select(it, "list"));
        listEl.appendChild(card);
      });

      if (shown.length > LIST_LIMIT) {
        const more = document.createElement("p");
        more.className = "empty";
        more.textContent = "가까운 " + LIST_LIMIT + "곳만 보여줘요. 지도를 확대하거나 검색으로 좁혀보세요.";
        listEl.appendChild(more);
      }
    }

    // ------------------------------------------------------------
    //  카페 선택 → 지도 이동 + 로드뷰 열기
    // ------------------------------------------------------------
    function select(it, source) {
      lastPick = Date.now();
      focusedId = it.id;

      document.querySelectorAll("#list .item").forEach(el =>
        el.classList.toggle("focus", el.dataset.id === it.id)
      );
      if (source === "map") {
        const card = $("list").querySelector('[data-id="' + it.id + '"]');
        if (card) card.scrollIntoView({ block: "nearest" });
      }

      $("viewInfo").innerHTML =
        '<div class="t">' + esc(it.n) + (it.p ? " 🐾" : "") + "</div>" +
        '<div class="s">' + esc(it.a) + (it.t ? " · " + esc(it.t) : "") +
        (it.u ? ' · <a href="' + esc(it.u) + '" target="_blank" rel="noopener">카카오맵에서 보기</a>' : "") + "</div>";

      // 로드뷰 패널을 먼저 열고(지도 크기가 줄어듦), 그다음 지도를 다시 맞춤
      $("rvPanel").style.display = "flex";
      ensureRoadview();
      showRoadview(it);

      map.relayout();
      if (map.getLevel() > 4) map.setLevel(4);
      map.panTo(it.pos);

      infoWindow.setContent('<div class="iw"><b>' + esc(it.n) + "</b></div>");
      infoWindow.setPosition(it.pos);
      infoWindow.open(map);
    }

    function closeRoadview() {
      $("rvPanel").style.display = "none";
      pendingFace = null;
      map.relayout();
    }

    // ------------------------------------------------------------
    //  로드뷰
    // ------------------------------------------------------------
    function ensureRoadview() {
      if (rv) return;
      rv = new kakao.maps.Roadview($("roadview"));
      rvClient = new kakao.maps.RoadviewClient();
      // 로드뷰가 준비되면, 대기 중이던 "카페 쪽으로 시선 돌리기"를 실행
      kakao.maps.event.addListener(rv, "init", runPending);
      kakao.maps.event.addListener(rv, "panoid_changed", () => setTimeout(runPending, 50));
    }

    function showRoadview(it) {
      $("rvMsg").style.display = "none";
      rv.relayout();
      rvClient.getNearestPanoId(it.pos, ROADVIEW_RADIUS, panoId => {
        if (it.id !== focusedId) return;      // 그 사이 다른 카페를 눌렀으면 무시
        if (panoId === null) {
          clearOverlays();
          pendingFace = null;
          $("rvMsg").style.display = "flex";
          $("rvMsg").innerHTML = "이 카페 주변 " + ROADVIEW_RADIUS + "m 안에는 로드뷰가 없어요 😢<br>다른 카페를 눌러보세요.";
          return;
        }
        pendingFace = () => faceCafe(it);
        if (rv.getPanoId() === panoId) {
          runPending();
        } else {
          rv.setPanoId(panoId, it.pos);
          setTimeout(runPending, 800);        // 이벤트를 놓쳤을 때를 위한 안전장치
        }
      });
    }

    function runPending() {
      if (!pendingFace) return;
      const f = pendingFace;
      try { f(); pendingFace = null; } catch (e) { /* 로드뷰가 아직 준비 전이면 다음 이벤트에서 다시 시도 */ }
    }

    function clearOverlays() {
      if (rvMarker) { rvMarker.setMap(null); rvMarker = null; }
      if (rvLabel) { rvLabel.setMap(null); rvLabel = null; }
    }

    // 카페 위치에 핀과 이름표를 올리고, 시선을 카페 쪽으로 돌림
    function faceCafe(it) {
      clearOverlays();
      rvMarker = new kakao.maps.Marker({ position: it.pos, map: rv });
      const vp = rv.getProjection().viewpointFromCoords(it.pos, rvMarker.getAltitude());
      rv.setViewpoint(vp);

      const el = document.createElement("div");
      el.className = "rv-label" + (it.p ? " pet" : "");
      el.textContent = (it.p ? "🐾 " : "☕ ") + it.n;
      rvLabel = new kakao.maps.CustomOverlay({ position: it.pos, content: el, xAnchor: 0.5, yAnchor: 2.6, map: rv });
    }
  </script>
</body>
</html>
